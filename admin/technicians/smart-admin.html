function monitoring(){return head("System Monitoring","Service signals, delivery health and operational events.")+`<div class="info-strip canva-banner"><strong>All systems operational.</strong> These are illustrative health indicators; production monitoring requires connected backend telemetry.</div><div class="grid metrics">${metric("Application uptime","99.98%","Past 30 days","server")}${metric("API response","48 ms","Average latency","network")}${metric("Notifications","98.6%","Delivery success","send")}${metric("Booking errors","12","Past 24 hours","triangle-alert",true)}</div><div class="grid two-col"><section class="card canva-card"><h2>Service status</h2><p class="subtitle">Current component health</p>${[["Application","Operational"],["Backend connectivity","Operational"],["Database","Operational"],["Authentication activity","Operational"],["Booking service","Operational"],["Notification delivery","Operational"]].map(x=>`<div class="health-row"><strong>${x[0]}</strong>${badge(x[1])}</div>`).join("")}</section><section class="card canva-card"><h2>Recent audit events</h2><p class="subtitle">Illustrative system trail</p>${[["Business application received","Today · 09:42"],["Subscription renewal processed","Today · 08:18"],["Notification retry completed","Yesterday · 16:05"],["Business status updated","Yesterday · 13:30"]].map(x=>`<div class="activity-row"><div><strong>${x[0]}</strong><small>${x[1]}</small></div>${icon("arrow-up-right")}</div>`).join("")}</section></div>`}
function support(){let d=tickets.filter(t=>(filter==="All"||t.status===filter)&&Object.values(t).join(" ").toLowerCase().includes(query.toLowerCase()));let p=paginate(d);return head("Support","Stay on top of business requests and technical issues.")+`<div class="grid metrics">${metric("Open tickets","12","Across the platform","headset")}${metric("Awaiting review","5","Needs triage","clock")}${metric("Resolved this week","28","↗ 18% vs last week","circle-check")}${metric("Avg. response","2.4h","Within service target","timer")}</div><section class="card canva-card">${toolbar("Search tickets...",["All","Open","Review","Resolved"])}${d.length?table(p.rows.map(t=>`<tr><td><strong>${esc(t.id)}</strong></td><td>${esc(t.name)}</td><td>${esc(t.category)}</td><td>${esc(t.city)}</td><td>${badge(t.status)}</td><td><button class="text-btn canva-button" data-ticket="${esc(t.id)}">View →</button></td></tr>`),["Ticket","Subject","Type","Business","Status","Action"])+p.footer:empty("No tickets found","Try another search or filter.")}</section>`}
function settings(){return head("Settings","Manage platform configuration and operational policy.")+`<div class="grid two-col"><section class="card canva-card"><div class="card-head"><div><h2>Administration</h2><p>Prototype configuration areas</p></div></div>${[["Administrator accounts","Manage platform operators","users"],["Role-based permissions","Define access by responsibility","shield-check"],["Platform configuration","Manage tenant defaults","sliders-horizontal"],["Service categories","Organize searchable services","list"],["Search visibility","Control business discovery","eye"],["Audit trail","Review administrative activity","scroll-text"]].map(x=>`<div class="list-row"><div class="health-left"><span class="health-icon">${icon(x[2])}</span><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div><button class="text-btn canva-button" data-setting="${x[0]}">Open →</button></div>`).join("")}</section><section class="stack"><article class="card canva-card"><h2>Platform readiness</h2><p class="subtitle">Integration checklist</p>${[["Supabase Auth","Required for production"],["Server-side admin operations","Required for production"],["Row-level security","Required for production"],["Audit logging","Required for production"]].map(x=>`<div class="health-row"><div><strong>${x[0]}</strong><small>${x[1]}</small></div>${badge("Pending")}</div>`).join("")}</article><article class="card canva-card"><h2>About this workspace</h2><p class="subtitle" style="margin-top:12px">This prototype demonstrates platform operations with sample data. It does not provide administrator authentication or production access control.</p></article></section></div>`}
function render(){nav();$("#breadcrumb-title").textContent=page;const views={"Overview":overview,"Businesses":()=>businesses(false),"Applications":()=>businesses(true),"Subscriptions":subscriptions,"Licences":licences,"Customers":customers,"Appointments":appointments,"Financials":financials,"Analytics":analytics,"System Monitoring":monitoring,"Support":support,"Settings":settings};$("#content").innerHTML=views[page]();drawIcons()}
function openDrawer(html){$("#overlay-root").innerHTML=`<div class="overlay" id="overlay"><div class="drawer canva-panel" role="dialog" aria-modal="true" aria-label="Details">${html}</div></div>`;drawIcons()}
function drawerHead(label,title){return `<div class="drawer-head"><div><div class="eyebrow">${label}</div><h2>${esc(title)}</h2></div><button class="icon-btn canva-button" data-action="close" aria-label="Close panel">${icon("x")}</button></div>`}
function register(){openDrawer(drawerHead("ONBOARDING","Register a business")+`<div class="info-strip canva-banner">Create a business application for review. Approval can be completed from its detail view.</div><form id="register-form"><div class="field-grid"><label class="field">Business name<input id="reg-name" name="name" class="input canva-input" required maxlength="80" placeholder="e.g. The Good Cut"></label><label class="field">Category<select id="reg-category" name="category" class="input canva-dropdown"><option>Barbershop</option><option>Hair salon</option><option>Beauty studio</option><option>Wellness</option></select></label><label class="field">City<input id="reg-city" name="city" class="input canva-input" required maxlength="60" placeholder="e.g. London"></label><label class="field">Contact email<input id="reg-email" name="contact_email" type="email" class="input canva-input" required placeholder="owner@example.com"></label><label class="field">Requested plan<select id="reg-plan" name="plan" class="input canva-dropdown"><option>Starter</option><option>Growth</option><option>Pro</option></select></label><label class="field full">Review notes<textarea id="reg-notes" name="notes" class="canva-input" maxlength="500" placeholder="Optional onboarding context"></textarea></label></div><div class="form-actions"><button type="button" class="btn secondary canva-button" data-action="close">Cancel</button><button id="register-submit" type="submit" class="btn teal canva-button">${icon("arrow-right")} Submit application</button></div></form>`)}
function detail(id){let b=allBusinesses().find(x=>x.id===id);if(!b){notify("Business no longer available.",true);return}detailId=id;openDrawer(drawerHead("BUSINESS PROFILE",b.name)+`<div class="card canva-card" style="margin-bottom:16px"><div class="name-cell"><span class="mini-logo" style="width:44px;height:44px">${esc(b.name[0])}</span><div><strong style="font-size:16px">${esc(b.name)}</strong><small>${esc(b.category)} · ${esc(b.city)}</small></div><span style="margin-left:auto">${badge(b.status)}</span></div></div><div class="detail-grid">${[["Contact email",b.contact_email],["Subscription",b.plan],["Locations",b.locations||1],["Appointments",b.appointments||0],["Registered",b.created_at?.slice(0,10)||"—"],["Account type",b.saved?"Saved application":"Demo record"]].map(x=>`<div class="detail-item"><small>${x[0]}</small><strong>${esc(x[1])}</strong></div>`).join("")}</div><div class="card canva-card" style="margin-top:16px"><h3>Verification & activity</h3><p class="subtitle">${b.saved?"Review the submitted profile and notes before making a decision.":"This sample profile demonstrates the business detail layout."}</p><div class="health-row"><strong>Business information</strong>${badge(b.saved?"Review":"Verified")}</div><div class="health-row"><strong>Verification documents</strong><span class="subtitle">No documents attached</span></div><div class="health-row"><strong>Recent activity</strong><span class="subtitle">${b.saved?"Application submitted":"Profile viewed in demo"}</span></div>${b.notes?`<p style="margin:12px 0 0"><strong>Notes:</strong> ${esc(b.notes)}</p>`:""}</div>${b.saved?`<div class="card canva-card" style="margin-top:16px"><h3>Manage access</h3><label class="field" style="margin-top:13px">Subscription plan<select id="detail-plan" class="input canva-dropdown"><option ${b.plan==="Starter"?"selected":""}>Starter</option><option ${b.plan==="Growth"?"selected":""}>Growth</option><option ${b.plan==="Pro"?"selected":""}>Pro</option></select></label><div class="form-actions" style="justify-content:flex-start"><button class="btn small secondary canva-button" data-update="plan">Save plan</button>${b.status==="Pending"?`<button class="btn small teal canva-button" data-update="Active">Approve</button><button class="btn small danger canva-button" data-update="Rejected">Reject</button>`:`<button class="btn small secondary canva-button" data-update="${b.status==="Suspended"?"Active":"Suspended"}">${b.status==="Suspended"?"Reactivate":"Suspend"}</button>`}</div></div>`:`<div class="info-strip canva-banner" style="margin-top:16px">Sample records are read-only. Register a business to try the full approval workflow.</div>`}`)}
async function updateBusiness(action,button){let b=saved.find(x=>x.__backendId===detailId);if(!b)return;button.disabled=true;button.textContent="Saving…";let next={...b,...(action==="plan"?{plan:$("#detail-plan").value}:{status:action})};try{let result=await window.dataSdk.update(next);if(!result.isOk)throw result.error;notify(action==="plan"?"Subscription plan updated.":`Business ${action.toLowerCase()}.`);$("#overlay-root").innerHTML="";render()}catch(e){notify("Could not save the change. Please try again.",true);button.disabled=false;button.textContent="Retry"}}
function infoPanel(title,body){openDrawer(drawerHead("WORKSPACE",title)+`<div class="card canva-card"><p class="subtitle">${body}</p></div><div class="form-actions"><button class="btn secondary canva-button" data-action="close">Close</button></div>`)}
document.addEventListener("click",e=>{let n=e.target.closest("[data-nav]");if(n){setPage(n.dataset.nav);return}let d=e.target.closest("[data-detail]");if(d){detail(d.dataset.detail);return}let a=e.target.closest("[data-action]");if(a){let v=a.dataset.action;if(v==="register")register();if(v==="close")$("#overlay-root").innerHTML="";if(v==="plan")infoPanel("Create subscription plan","Plan creation is represented in this prototype by the three configured sample tiers. Connect a protected Supabase administrative endpoint to create production plans.");if(v==="plan-info")infoPanel(a.dataset.value+" plan",`Review the ${a.dataset.value} plan card for pricing, limits and current adoption. Production changes require a protected administrative endpoint.`);return}let p=e.target.closest("[data-page]");if(p){pageNo+=Number(p.dataset.page);render();return}let u=e.target.closest("[data-update]");if(u){updateBusiness(u.dataset.update,u);return}let t=e.target.closest("[data-ticket]");if(t){let item=tickets.find(x=>x.id===t.dataset.ticket);infoPanel(item.id+" · "+item.name,`${item.category} from ${item.city}. Current status: ${item.status}. Ticket updates require a connected support backend.`);return}let s=e.target.closest("[data-setting]");if(s){infoPanel(s.dataset.setting,`${s.dataset.setting} is a production configuration area. Connect Supabase with administrator-only server-side operations and audit logging before enabling changes.`);return}if(e.target.id==="notifications-btn")infoPanel("Notifications","You’re all caught up in this demonstration workspace. New live notifications require a connected backend.");if(e.target.id==="mobile-menu")$("#sidebar").classList.toggle("open");if(e.target.id==="overlay")$("#overlay-root").innerHTML=""});
document.addEventListener("input",e=>{if(e.target.id==="list-search"){let start=e.target.selectionStart;query=e.target.value;pageNo=1;render();let field=$("#list-search");field.focus();field.setSelectionRange(start,start)}});
document.addEventListener("change",e=>{if(e.target.id==="list-filter"){filter=e.target.value;pageNo=1;render()}});
document.addEventListener("submit",async e=>{if(e.target.id!=="register-form")return;e.preventDefault();let btn=$("#register-submit");if(!ready){notify("Workspace is not ready. Please try again shortly.",true);return}if(saved.length>=999){notify("The workspace has reached its 999-record limit.",true);return}let form=new FormData(e.target);let record={record_type:"business",name:String(form.get("name")).trim(),category:String(form.get("category")),city:String(form.get("city")).trim(),contact_email:String(form.get("contact_email")).trim(),plan:String(form.get("plan")),status:"Pending",notes:String(form.get("notes")).trim(),created_at:new Date().toISOString()};btn.disabled=true;btn.textContent="Submitting…";try{let result=await window.dataSdk.create(record);if(!result.isOk)throw result.error;$("#overlay-root").innerHTML="";setPage("Applications");notify("Business application submitted for review.")}catch(err){btn.disabled=false;btn.textContent="Submit application";notify("Application could not be saved. Please try again.",true)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#overlay-root").innerHTML="";$("#sidebar").classList.remove("open")}});
render();
(async()=>{try{let result=await window.dataSdk.init({onDataChanged(data){saved=data;render()}});if(!result.isOk)throw result.error;ready=true}catch(e){notify("Saved business data is unavailable. Demo views remain accessible.",true)}})();
</script>
 </body>
</html>
