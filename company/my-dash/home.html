function setPage(next){if(!permissions[role].includes(next))return;page=next;query="";filter="All";$("#overlay-root").innerHTML="";$("#sidebar").classList.remove("open");render()}
function drawer(title,content){$("#overlay-root").innerHTML=`<div class="overlay" id="overlay"><div class="drawer canva-panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-head"><div><div class="eyebrow">SMART BARBER BUSINESS</div><h2>${esc(title)}</h2></div><button class="icon-btn canva-button" data-action="close" aria-label="Close panel">${icon("x")}</button></div>${content}</div></div>`;icons()}
const field=(label,key,value="",type="text",extra="")=>`<label class="field" for="field-${key}">${esc(label)}<input id="field-${key}" name="${key}" type="${type}" class="input canva-input" value="${esc(value)}" ${extra}></label>`;
const selectField=(label,key,options,value)=>`<label class="field" for="field-${key}">${esc(label)}<select id="field-${key}" name="${key}" class="input canva-dropdown">${options.map(x=>`<option ${x===value?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`;
function editForm(type,id){let x=id?find(type,id):null;if(id&&!x){notify("Record not available.",true);return}let title=(id?"Manage ":"Add ")+({appointment:"appointment",employee:"employee",service:"service",customer:"customer",branch:"branch",config:"business profile",promotion:"promotion",membership:"membership",loyalty:"loyalty programme",announcement:"announcement"}[type]||type);
 let fields="";
 if(type==="appointment"){let employee=records("employee"),service=records("service");fields=field("Customer name","name",x?.name,"text","required maxlength=80")+selectField("Service","service",service.filter(s=>s.status!=="Inactive").map(s=>s.name),x?.service)+selectField("Employee","employee",employee.filter(e=>e.status!=="Inactive").map(e=>e.name),x?.employee)+field("Date and time","starts_at",x?localDateTime(x.starts_at):localDateTime(isoAt(0,16)),"datetime-local","required")+selectField("Branch","city",records("branch").map(b=>b.name),x?.city)+selectField("Status","status",["Pending","Confirmed","In Progress","Completed","Declined","Cancelled","Expired","No Show"],x?.status||"Confirmed")+field("Duration (minutes)","duration",x?.duration||service[0]?.duration||30,"number","required min=5 max=480")+field("Price (£)","amount",x?.amount||service[0]?.amount||0,"number","required min=0 step=0.01")}
 else if(type==="employee")fields=field("Employee name","name",x?.name,"text","required maxlength=80")+field("Role / specialty","category",x?.category||"Stylist","text","required")+selectField("Branch","city",records("branch").map(b=>b.name),x?.city)+field("Working hours","details",x?.details||"09:00–18:00")+selectField("Availability","status",["Active","Inactive"],x?.status||"Active")+field("Assigned services (comma-separated)","notes",x?.notes||"");
 else if(type==="service")fields=field("Service name","name",x?.name,"text","required maxlength=80")+field("Description","details",x?.details||"")+field("Duration (minutes)","duration",x?.duration||30,"number","required min=5 max=480")+field("Price (£)","amount",x?.amount||0,"number","required min=0 step=0.01")+selectField("Availability","status",["Active","Inactive"],x?.status||"Active")+field("Assigned employees (comma-separated)","notes",x?.notes||"");
 else if(type==="customer")fields=field("Customer name","name",x?.name,"text","required maxlength=80")+field("Preferences","notes",x?.notes||"")+field("Feedback","details",x?.details||"");
 else if(type==="branch")fields=field("Branch name","name",x?.name,"text","required")+field("Address","details",x?.details||"")+field("Operating hours","notes",x?.notes||"09:00–18:00")+selectField("Status","status",["Active","Inactive"],x?.status||"Active");
 else if(type==="config")fields=field("Business name","name",x?.name||tenants[tenant],"text","required")+field("Description","details",x?.details||"")+field("Operating hours","category",x?.category||"Mon–Sat · 09:00–18:00")+field("Booking policy","notes",x?.notes||"");
 else fields=field("Title","name",x?.name,"text","required maxlength=80")+field("Description","details",x?.details||"")+selectField("Status","status",["Active","Inactive"],x?.status||"Active");
 let history=type==="customer"&&x?`<section class="card canva-card section-gap"><h3>Appointment history</h3>${records("appointment").filter(a=>a.name===x.name).map(a=>`<div class="list-row"><span>${dateText(a.starts_at)} · ${esc(a.service)}</span>${badge(a.status)}</div>`).join("")||`<p class="muted-note">No appointment history yet.</p>`}</section>`:"";
 let actions=type==="appointment"&&x?`<div class="section-gap"><h3>Quick actions</h3><div class="form-actions" style="justify-content:flex-start">${[["Pending","Accept","Confirmed"],["Pending","Decline","Declined"],["Confirmed","Start","In Progress"],["Confirmed","Complete","Completed"],["In Progress","Complete","Completed"],["Confirmed","No show","No Show"],["Confirmed","Cancel","Cancelled"],["Pending","Cancel","Cancelled"]].filter(([from])=>from===x.status).map(([,label,to])=>`<button type="button" class="btn small secondary canva-button" data-status="${esc(to)}" data-id="${esc(x.item_id)}">${esc(label)}</button>`).join("")}</div><p class="muted-note">Change the date and time above, then save to reschedule. Status changes on sample bookings create an editable workspace copy.</p></div>`:"";
 drawer(title,`${x&&!x.__backendId?`<div class="info-strip canva-banner">This is a sample record. Saving creates an editable copy in this business workspace.</div>`:""}<form id="edit-form" data-type="${esc(type)}" data-id="${esc(id||"")}"><div class="field-grid">${fields}</div><div class="form-actions"><button type="button" class="btn secondary canva-button" data-action="close">Cancel</button>${x?.__backendId?`<button type="button" class="btn danger canva-button" data-remove="${esc(type)}:${esc(id)}">Delete</button>`:""}<button id="save-button" class="btn teal canva-button" type="submit">${icon("check")} Save changes</button></div></form>${actions}${history}`);
}
function localDateTime(value){let d=new Date(value);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function overlaps(value,ignore){if(value.record_type!=="appointment"||!["Pending","Confirmed","In Progress"].includes(value.status))return false;let start=new Date(value.starts_at).getTime(),end=start+Number(value.duration)*60000;return records("appointment").some(a=>a.item_id!==ignore&&a.employee===value.employee&&a.city===value.city&&["Pending","Confirmed","In Progress"].includes(a.status)&&start<new Date(a.starts_at).getTime()+Number(a.duration)*60000&&end>new Date(a.starts_at).getTime())}
function withinHours(value){if(value.record_type!=="appointment")return true;let employee=records("employee").find(e=>e.name===value.employee);if(!employee||employee.status==="Inactive")return false;let match=(employee.details||"").match(/(\d\d):(\d\d)\s*[–-]\s*(\d\d):(\d\d)/);if(!match)return true;let d=new Date(value.starts_at),minutes=d.getHours()*60+d.getMinutes();return minutes>=Number(match[1])*60+Number(match[2])&&minutes+Number(value.duration)<=Number(match[3])*60+Number(match[4])}
async function saveRecord(value,existing,button){if(busy)return;if(!ready){notify("Workspace is still loading. Try again shortly.",true);return}if(!existing&&saved.length>=999){notify("The workspace has reached its 999-record limit.",true);return}busy=true;button.disabled=true;let old=button.innerHTML;button.textContent="Saving…";try{let result=existing?await window.dataSdk.update({...existing,...value}):await window.dataSdk.create(value);if(!result.isOk)throw result.error;$("#overlay-root").innerHTML="";render();notify("Changes saved to your workspace.")}catch(e){notify("Could not save. Please try again.",true);button.disabled=false;button.innerHTML=old}finally{busy=false}}
function noticePanel(){let pending=appointmentsData().filter(a=>a.status==="Pending");drawer("Booking notifications",pending.length?pending.map(a=>`<div class="list-row"><div><strong>${esc(a.name)}</strong><small>${esc(a.service)} · ${dateText(a.starts_at)} at ${timeText(a.starts_at)}</small></div><button class="btn small secondary canva-button" data-detail="appointment:${esc(a.item_id)}">Review</button></div>`).join(""):empty("All caught up","There are no pending booking requests."))}
document.addEventListener("click",async e=>{
 let n=e.target.closest("[data-nav]");if(n){setPage(n.dataset.nav);return}
 let d=e.target.closest("[data-detail]");if(d){let [type,id]=d.dataset.detail.split(":");editForm(type,id);return}
 let a=e.target.closest("[data-action]");if(a){let value=a.dataset.action;if(value==="close")$("#overlay-root").innerHTML="";else if(value==="walkin"){editForm("appointment");setTimeout(()=>{let s=$("#field-status");if(s)s.value="Confirmed"},0)}else if(value.startsWith("new:"))editForm(value.slice(4));return}
 let v=e.target.closest("[data-view]");if(v){view=v.dataset.view;render();return}
 let w=e.target.closest("[data-week]");if(w){weekShift=w.dataset.week==="today"?0:weekShift+Number(w.dataset.week);render();return}
 let s=e.target.closest("[data-status]");if(s){let x=find("appointment",s.dataset.id);if(!x)return;let value={...x,status:s.dataset.status};delete value.__backendId;if(overlaps(value,x.item_id)&&value.status==="Confirmed"){notify("That employee is already booked at this time.",true);return}if(!withinHours(value)&&value.status==="Confirmed"){notify("This booking falls outside the employee’s working hours.",true);return}await saveRecord(value,x.__backendId?x:null,s);return}
 let remove=e.target.closest("[data-remove]");if(remove){let [type,id]=remove.dataset.remove.split(":"),x=find(type,id);if(!x?.__backendId)return;if(remove.dataset.confirm!=="yes"){remove.dataset.confirm="yes";remove.textContent="Confirm delete";return}if(busy)return;busy=true;remove.disabled=true;remove.textContent="Deleting…";try{let result=await window.dataSdk.delete(x);if(!result.isOk)throw result.error;$("#overlay-root").innerHTML="";render();notify("Record deleted.")}catch(err){remove.disabled=false;remove.textContent="Try delete again";notify("Could not delete the record.",true)}finally{busy=false}return}
 if(e.target.closest("#notifications-btn")){noticePanel();return}if(e.target.closest("#mobile-menu")){$("#sidebar").classList.toggle("open");return}if(e.target.id==="overlay")$("#overlay-root").innerHTML="";
});
document.addEventListener("submit",async e=>{if(e.target.id!=="edit-form")return;e.preventDefault();let form=e.target,type=form.dataset.type,id=form.dataset.id,x=id?find(type,id):null,values=Object.fromEntries(new FormData(form));let value={record_type:type,tenant_id:tenant,item_id:id||`${type}-${Date.now()}`,name:(values.name||"").trim(),category:values.category||"",city:values.city||"",contact_email:"",plan:"",status:values.status||"Active",notes:values.notes||"",created_at:x?.created_at||new Date().toISOString(),service:values.service||"",employee:values.employee||"",starts_at:values.starts_at?new Date(values.starts_at).toISOString():"",duration:Number(values.duration||0),amount:Number(values.amount||0),details:values.details||""};
 if(type==="config"&&!id)value.item_id="profile";
 if(type==="appointment"){if(!withinHours(value)){notify("The booking falls outside the selected employee’s working hours.",true);return}if(overlaps(value,id)){notify("That employee already has an overlapping booking at this branch.",true);return}}
 await saveRecord(value,x?.__backendId?x:null,$("#save-button"));
});
document.addEventListener("input",e=>{if(e.target.id==="search"){let pos=e.target.selectionStart;query=e.target.value;render();let input=$("#search");input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{if(e.target.id==="tenant-select"){tenant=e.target.value;branch="All branches";query="";filter="All";render()}if(e.target.id==="role-select"){role=e.target.value;render()}if(e.target.id==="branch-select"){branch=e.target.value;render()}if(e.target.id==="filter"){filter=e.target.value;render()}if(e.target.id==="field-service"){let service=records("service").find(s=>s.name===e.target.value);if(service){$("#field-duration").value=service.duration;$("#field-amount").value=service.amount}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#overlay-root").innerHTML="";$("#sidebar").classList.remove("open")}});
$("#content").innerHTML='<div class="card canva-card">Loading business workspace…</div>';
(async()=>{try{let result=await window.dataSdk.init({onDataChanged(data){saved=data;render()}});if(!result.isOk)throw result.error;ready=true;render()}catch(e){render();notify("Saved changes are unavailable. Sample views remain accessible.",true)}})();
</script>
 </body>
</html>
