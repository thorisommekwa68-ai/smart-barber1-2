function detail(p){return `<button class="text-btn canva-button" data-action="back" style="margin-bottom:20px">← Back to explore</button><div class="profile-hero"><img id="detail-image-${p.id}" class="canva-image" src="${p.image}" alt="Inside ${esc(p.name)}" loading="lazy"><div class="profile-info"><span class="pill">${esc(p.category)}</span><h1>${esc(p.name)}</h1><div class="rating">${icon("star")} ${p.rating} <span class="muted" style="font-weight:400">(${p.reviews} reviews)</span></div><p style="margin-top:17px">${esc(p.description)}</p><div class="detail-line">${icon("map-pin")} ${esc(p.area)}, ${esc(p.city)} · ${esc(p.distance)}</div><div class="detail-line">${icon("clock-3")} ${esc(p.hours)}</div><div class="detail-line">${icon("calendar-check")} Next opening: ${esc(p.next)}</div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:23px"><button class="btn canva-button" data-book="${p.id}">Book an appointment ${icon("arrow-right")}</button><button class="btn ghost canva-button" data-favourite="${p.id}">${icon("heart")} ${savedProviders.has(p.id)?"Saved":"Save"}</button></div></div></div><div class="detail-columns"><section class="panel canva-panel"><div class="eyebrow">THE MENU</div><h2>Services & prices</h2>${p.services.map((s,i)=>`<div class="service-row"><div><h3>${esc(s[0])}</h3><p>${esc(s[3])} · ${s[2]} min</p></div><div class="service-actions"><strong>${money(s[1])}</strong><button class="btn small secondary canva-button" data-book="${p.id}" data-service="${i}">Book</button><button class="icon-btn canva-button" data-service-favourite="${p.id}:${i}" aria-label="${savedServices.has(p.id+":"+i)?"Remove favourite":"Favourite"} ${esc(s[0])}" style="color:${savedServices.has(p.id+":"+i)?"#d24e61":"var(--teal)"}">${icon("heart")}</button></div></div>`).join("")}</section><aside><section class="panel canva-panel"><div class="eyebrow">THE PEOPLE</div><h2>Meet the team</h2><p class="muted">${p.team.map(esc).join(" · ")} · Or choose anyone available.</p><div class="eyebrow" style="margin-top:23px">THE WORK</div><div class="portfolio">${p.portfolio.map((src,i)=>`<img id="portfolio-${p.id}-${i}" class="canva-image" src="${src}" alt="Portfolio example ${i+1} from ${esc(p.name)}" loading="lazy">`).join("")}</div></section><section class="panel canva-panel" style="margin-top:17px"><div class="eyebrow">KIND WORDS</div><h2>Customer notes</h2>${p.review.map((r,i)=>`<div class="review"><span class="rating">${icon("star")} 5.0</span><p>“${esc(r)}”</p><small class="muted">Verified visitor ${i+1}</small></div>`).join("")}</section></aside></div>`}
function bookings(){let mine=records.filter(x=>x.record_type==="customer_booking"&&ownedIds.has(x.item_id)).sort((a,b)=>b.created_at.localeCompare(a.created_at));return `<div class="eyebrow">YOUR TIME</div><h1 class="page-title">My bookings.</h1><p class="muted">Keep track of requests made during this visit.</p><div class="notice canva-banner" style="margin:22px 0">Booking requests are saved for review. They are not confirmed appointments. This preview does not provide a private account, so only requests made in this open visit appear here.</div>${mine.length?mine.map(x=>`<article class="panel canva-card" style="margin-bottom:14px"><div class="booking-row"><div><span class="status ${x.status==="Cancelled"?"cancelled":""}">${esc(x.status)}</span><h3 style="margin:12px 0 3px">${esc(providers.find(p=>p.id===x.tenant_id)?.name||"Studio")} · ${esc(x.service)}</h3><p class="muted" style="margin:0">${new Date(x.starts_at).toLocaleDateString("en-ZA",{weekday:"long",day:"numeric",month:"long",year:"numeric"})} at ${new Date(x.starts_at).toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit"})} · ${esc(x.employee)} · ${money(x.amount)}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${x.status!=="Cancelled"?`<button class="btn small secondary canva-button" data-reschedule="${esc(x.item_id)}">Reschedule</button><button class="btn small ghost canva-button" data-cancel="${esc(x.item_id)}">Cancel</button>`:""}</div></div></article>`).join(""):empty("No requests yet","When you request an appointment, its details will appear here during this visit.")}<button class="btn secondary canva-button" data-nav="Explore" style="margin-top:20px">Find an appointment ${icon("arrow-right")}</button>`}
function favourites(){let ps=providers.filter(p=>savedProviders.has(p.id));let ss=[...savedServices].map(key=>{let [id,n]=key.split(":"),p=providers.find(x=>x.id===id);return p?{p,s:p.services[Number(n)],n}:null}).filter(Boolean);return `<div class="eyebrow">YOUR SHORTLIST</div><h1 class="page-title">Favourites.</h1><p class="muted">Keep the places and services you love close by during this visit.</p><section class="section">${sectionTitle("Saved places")}${ps.length?`<div class="results">${ps.map(card).join("")}</div>`:empty("Your shortlist starts here","Tap the heart on a studio to save it.")}</section><section class="section">${sectionTitle("Favourite services")}${ss.length?ss.map(({p,s,n})=>`<div class="panel canva-card" style="margin-bottom:10px"><div class="service-row" style="padding:0"><div><h3>${esc(s[0])}</h3><p>${esc(p.name)} · ${s[2]} min</p></div><div class="service-actions"><strong>${money(s[1])}</strong><button class="btn small secondary canva-button" data-book="${p.id}" data-service="${n}">Book</button><button class="icon-btn canva-button" data-service-favourite="${p.id}:${n}" aria-label="Remove favourite">${icon("x")}</button></div></div></div>`).join(""):empty("No favourite services yet","Save a service from a studio's menu to find it quickly.")}</section>`}
function profile(){return `<div class="eyebrow">YOUR SPACE</div><h1 class="page-title">A little more you.</h1><p class="muted">Your preferences for this marketplace preview.</p><div class="detail-columns"><div><section class="panel canva-panel"><h2>Welcome, guest</h2><p class="muted">Explore independent studios across South Africa. Account registration and sign-in are not available in this standalone preview.</p><div class="service-row"><span>Preferred city</span><strong>${esc(city)}</strong></div><div class="service-row"><span>Saved places</span><strong>${savedProviders.size}</strong></div><div class="service-row"><span>Favourite services</span><strong>${savedServices.size}</strong></div><button class="btn secondary canva-button" data-nav="Bookings" style="margin-top:18px">View appointment requests</button></section><section class="panel canva-panel" style="margin-top:18px"><h2>Notification preferences</h2><p class="muted">Preview preferences only. This page cannot send push notifications.</p>${[["reminders","Appointment reminders"],["updates","Booking status updates"],["offers","Offers & inspiration"]].map(([key,label])=>`<label class="toggle-row" for="pref-${key}"><span>${label}</span><input id="pref-${key}" type="checkbox" ${noticePrefs[key]?"checked":""}></label>`).join("")}</section></div><aside><section class="loyalty canva-panel"><div class="eyebrow" style="color:#76d9c6">THE GOOD STUFF</div><h2>Good things come back around.</h2><p>Membership perks and loyalty rewards are coming to Smart Barber. Discover a new favourite in the meantime.</p><button class="btn secondary canva-button" data-nav="Explore">Explore studios</button></section><section class="panel canva-panel" style="margin-top:18px"><h2>About this preview</h2><p class="muted">Studio listings, ratings, portfolios and opening times are illustrative. Booking requests can be submitted, but availability is not synchronized with providers and confirmation cannot be delivered here.</p></section></aside></div>`}
function render(){let content=page==="Home"?home():page==="Explore"?explore():page==="Bookings"?bookings():page==="Favourites"?favourites():page==="Profile"?profile():selectedProvider?detail(selectedProvider):explore();$("#content").innerHTML=content;$("#bottom-inner").innerHTML=navItems.map(([n,i])=>`<button class="canva-button ${page===n?"active":""}" data-nav="${n}" ${page===n?'aria-current="page"':""}>${icon(i)}<span>${n}</span></button>`).join("");$("#location-select").value=city;icons()}
function go(p){page=p;selectedProvider=null;window.scrollTo({top:0,behavior:"smooth"});render()}
function openProvider(id){selectedProvider=providers.find(p=>p.id===id);if(!selectedProvider)return;recent=[id,...recent.filter(x=>x!==id)];page="Detail";window.scrollTo({top:0,behavior:"smooth"});render()}
function modalWrap(title,body){$("#overlay-root").innerHTML=`<div class="overlay" id="overlay"><div class="modal canva-panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><div class="eyebrow">SMART BARBER / APPOINTMENTS</div><h2>${esc(title)}</h2></div><button class="icon-btn canva-button" data-action="close" aria-label="Close">${icon("x")}</button></div>${body}</div></div>`;icons()}
function dateValue(offset=1){let d=new Date();d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function availableTimes(){let p=providers.find(x=>x.id===booking.providerId),times=["09:00","10:00","11:00","12:30","14:00","15:00","16:00","17:00"];return times.map(t=>{let dt=new Date(booking.date+"T"+t+":00"),taken=records.some(x=>x.record_type==="customer_booking"&&x.tenant_id===p.id&&x.status!=="Cancelled"&&x.starts_at===dt.toISOString()&&(booking.employee==="Any available"||x.employee===booking.employee)&&x.item_id!==booking.editId);return `<button type="button" class="canva-button ${booking.time===t?"selected":""}" data-time="${t}" ${taken||dt<=new Date()?"disabled":""}>${t}</button>`}).join("")}
function bookingForm(){let p=providers.find(x=>x.id===booking.providerId);if(!p)return;modal="booking";modalWrap(booking.editId?"Reschedule request":"Make time for yourself",`<p class="muted">Choose a service and a time with ${esc(p.name)}.</p><div class="form-grid"><label class="field full" for="book-service">Service<select id="book-service" class="input canva-dropdown">${p.services.map((s,i)=>`<option value="${i}" ${booking.serviceIndex===i?"selected":""}>${esc(s[0])} · ${money(s[1])} · ${s[2]} min</option>`).join("")}</select></label><label class="field" for="book-employee">Your professional<select id="book-employee" class="input canva-dropdown">${["Any available",...p.team].map(n=>`<option ${booking.employee===n?"selected":""}>${esc(n)}</option>`).join("")}</select></label><label class="field" for="book-date">Preferred date<input id="book-date" class="input canva-input" type="date" min="${dateValue(0)}" max="${dateValue(30)}" value="${booking.date}"></label><div class="field full"><span>Available times</span><div id="time-options" class="times">${availableTimes()}</div></div></div><div class="notice canva-banner">Times shown are illustrative. Your request is pending until the studio accepts it; this preview cannot deliver a provider response.</div><div class="modal-actions"><button class="btn ghost canva-button" data-action="close">Not now</button><button class="btn canva-button" data-action="review">Review request ${icon("arrow-right")}</button></div>`)}
function reviewBooking(){let p=providers.find(x=>x.id===booking.providerId),s=p.services[booking.serviceIndex];if(!booking.time){toast("Choose an available time first.",true);return}modal="review";modalWrap("Review your request",`<p class="muted">One last look before you send it.</p><div class="summary">${[["Studio",p.name],["Service",s[0]],["Professional",booking.employee],["Date",dateLabel(booking.date)],["Time",booking.time],["Duration",s[2]+" min"],["Price",money(s[1])]].map(([a,b])=>`<div><span class="muted">${esc(a)}</span><strong>${esc(b)}</strong></div>`).join("")}</div><p class="muted" style="font-size:12px;margin-top:18px">Changes and cancellations are available during this open visit. No payment is taken.</p><div class="modal-actions"><button class="btn ghost canva-button" data-action="back-booking">Back</button><button id="submit-booking" class="btn canva-button" data-action="submit-booking">${booking.editId?"Save new time":"Send booking request"}</button></div>`)}
function recordForBooking(){let p=providers.find(x=>x.id===booking.providerId),s=p.services[booking.serviceIndex];return {record_type:"customer_booking",name:"Guest",category:p.category,city:p.city,contact_email:"",plan:"",status:"Pending",notes:"Request only; provider acceptance not connected",created_at:new Date().toISOString(),tenant_id:p.id,item_id:booking.editId||"request-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),service:s[0],employee:booking.employee,starts_at:new Date(booking.date+"T"+booking.time+":00").toISOString(),duration:s[2],amount:s[1],details:p.area}}
async function commitBooking(button){if(busy)return;if(!ready){toast("Booking requests are unavailable right now. Please try again.",true);return}if(records.length>=999&&!booking.editId){toast("The booking-request limit has been reached.",true);return}let value=recordForBooking(),existing=records.find(x=>x.item_id===booking.editId);if(records.some(x=>x.record_type==="customer_booking"&&x.tenant_id===value.tenant_id&&x.starts_at===value.starts_at&&x.status!=="Cancelled"&&x.item_id!==value.item_id&&(value.employee==="Any available"||x.employee===value.employee))){toast("That time has just been requested. Choose another.",true);bookingForm();return}busy=true;button.disabled=true;button.textContent="Sending…";try{let r=existing?await window.dataSdk.update({...existing,...value,created_at:existing.created_at}):await window.dataSdk.create(value);if(!r.isOk)throw r.error;ownedIds.add(value.item_id);modal="success";modalWrap(booking.editId?"Time updated":"Request sent",`<div style="text-align:center;padding:20px 0">${icon("circle-check-big")}<h3 style="margin-top:14px">${booking.editId?"Your updated time is saved.":"Your request is on its way."}</h3><p class="muted">Status: Pending. A studio response is not connected in this preview, so please do not treat this as a confirmed appointment.</p><button class="btn canva-button" data-action="view-bookings">View my requests ${icon("arrow-right")}</button></div>`)}catch(e){button.disabled=false;button.textContent="Try again";toast("Could not save the request. Please try again.",true)}finally{busy=false}}
async function cancelBooking(id,button){if(busy)return;let x=records.find(r=>r.item_id===id&&ownedIds.has(id));if(!x)return;busy=true;button.disabled=true;button.textContent="Cancelling…";try{let r=await window.dataSdk.update({...x,status:"Cancelled"});if(!r.isOk)throw r.error;$("#overlay-root").innerHTML="";toast("Request cancelled.");render()}catch(e){button.disabled=false;button.textContent="Try again";toast("Could not cancel the request.",true)}finally{busy=false}}
document.addEventListener("click",e=>{let n=e.target.closest("[data-nav]");if(n){go(n.dataset.nav);return}let p=e.target.closest("[data-provider]");if(p){openProvider(p.dataset.provider);return}let f=e.target.closest("[data-favourite]");if(f){let id=f.dataset.favourite;savedProviders.has(id)?savedProviders.delete(id):savedProviders.add(id);render();toast(savedProviders.has(id)?"Studio saved for this visit.":"Studio removed from favourites.");return}let sf=e.target.closest("[data-service-favourite]");if(sf){let key=sf.dataset.serviceFavourite;savedServices.has(key)?savedServices.delete(key):savedServices.add(key);render();toast(savedServices.has(key)?"Service saved for this visit.":"Service removed from favourites.");return}let c=e.target.closest("[data-category]");if(c){category=c.dataset.category;go("Explore");return}let b=e.target.closest("[data-book]");if(b){booking={providerId:b.dataset.book,serviceIndex:Number(b.dataset.service||0),employee:"Any available",date:dateValue(1),time:"",editId:null};bookingForm();return}let t=e.target.closest("[data-time]");if(t){booking.time=t.dataset.time;$("#time-options").innerHTML=availableTimes();return}let re=e.target.closest("[data-reschedule]");if(re){let x=records.find(r=>r.item_id===re.dataset.reschedule&&ownedIds.has(r.item_id)),p=providers.find(q=>q.id===x?.tenant_id);if(!p)return;let dt=new Date(x.starts_at);booking={providerId:p.id,serviceIndex:Math.max(0,p.services.findIndex(s=>s[0]===x.service)),employee:x.employee,date:[dt.getFullYear(),String(dt.getMonth()+1).padStart(2,"0"),String(dt.getDate()).padStart(2,"0")].join("-"),time:dt.toTimeString().slice(0,5),editId:x.item_id};bookingForm();return}let ca=e.target.closest("[data-cancel]");if(ca){modal="cancel";modalWrap("Cancel this request?",`<p class="muted">This will mark the request as cancelled. This preview cannot notify the studio directly.</p><div class="modal-actions"><button class="btn ghost canva-button" data-action="close">Keep request</button><button class="btn dark canva-button" data-confirm-cancel="${ca.dataset.cancel}">Cancel request</button></div>`);return}let cc=e.target.closest("[data-confirm-cancel]");if(cc){cancelBooking(cc.dataset.confirmCancel,cc);return}let a=e.target.closest("[data-action]");if(a){let action=a.dataset.action;if(action==="close")$("#overlay-root").innerHTML="";if(action==="back")go("Explore");if(action==="review")reviewBooking();if(action==="back-booking")bookingForm();if(action==="submit-booking")commitBooking(a);if(action==="view-bookings"){$("#overlay-root").innerHTML="";go("Bookings")}if(action==="home-search"){search=$("#home-search").value.trim();go("Explore")}if(action==="reset-filters"){search="";category="All";maxPrice="All";minRating="All";availability="All";city="All cities";render()}return}if(e.target.id==="overlay")$("#overlay-root").innerHTML=""});
document.addEventListener("change",e=>{if(e.target.id==="location-select"){city=e.target.value;render()}if(e.target.id==="category-filter"){category=e.target.value;render()}if(e.target.id==="price-filter"){maxPrice=e.target.value;render()}if(e.target.id==="rating-filter"){minRating=e.target.value;render()}if(e.target.id==="availability-filter"){availability=e.target.value;render()}if(e.target.id==="book-service"){booking.serviceIndex=Number(e.target.value);booking.time="";bookingForm()}if(e.target.id==="book-employee"){booking.employee=e.target.value;booking.time="";bookingForm()}if(e.target.id==="book-date"){booking.date=e.target.value;booking.time="";bookingForm()}if(e.target.id.startsWith("pref-")){noticePrefs[e.target.id.slice(5)]=e.target.checked;toast("Preference updated for this visit.")}});
document.addEventListener("input",e=>{if(e.target.id==="explore-search"){let pos=e.target.selectionStart;search=e.target.value;render();let el=$("#explore-search");el.focus();el.setSelectionRange(pos,pos)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#overlay-root").innerHTML="";if(e.key==="Enter"&&e.target.id==="home-search"){search=e.target.value.trim();go("Explore")}});
$("#content").innerHTML='<div class="panel canva-panel">Finding beautiful places near you…</div>';
render();
(async()=>{try{let r=await window.dataSdk.init({onDataChanged(data){records=data;render()}});if(!r.isOk)throw r.error;ready=true;render()}catch(e){toast("Booking requests are temporarily unavailable. You can still explore studios.",true);render()}})();
</script>
 </body>
</html>
